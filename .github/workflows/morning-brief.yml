name: 每日AI早报推送
on:
  schedule:
    # Beijing time 8:00 = UTC 0:00
    - cron: '0 0 * * *'
  workflow_dispatch:  # Manual trigger
  # Also run when the repo is pushed to (for testing)
  push:
    branches: [main]

jobs:
  fetch-and-push:
    name: 搜索新闻并推送到微信
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行新闻采集脚本
        run: python3 scripts/fetch_and_push.py
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
