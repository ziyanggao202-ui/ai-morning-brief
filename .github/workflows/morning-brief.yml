name: 每日AI早报推送（图片来源）
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  fetch-and-push:
    name: 生图并推送微信
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: pip3 install Pillow

      - name: 采集新闻并推送
        run: python3 scripts/fetch_and_push.py
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
